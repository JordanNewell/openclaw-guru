name: plan-doc-guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block plan/roadmap docs
        run: |
          PATTERN='(^|/)(PLAN|ROADMAP|GAME-PLAN|MASTER-PLAN|GO-TO-MARKET|GTM)[^/]*\.md$|(^|/)docs/(superpowers/)?plans?/|(^|/)docs/roadmap/'
          if git diff --name-only origin/${{ github.event.pull_request.base.sha || 'HEAD~1' }}... 2>/dev/null | grep -iE "$PATTERN"; then
            echo "::error::Plan/roadmap docs are blocked in this repo. Strategy docs live outside git."
            exit 1
          fi
          # Full-tree check on first push / safety net
          if git ls-files | grep -iE "$PATTERN"; then
            echo "::error::Plan/roadmap docs are blocked in this repo."
            exit 1
          fi
          echo "No plan docs. Clean."
